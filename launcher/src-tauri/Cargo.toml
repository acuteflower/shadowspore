[package]
name = "shadowspore-launcher"
version = "0.1.0"
description = "Shadowspore Desktop Launcher"
authors = ["Shadowspore"]
edition = "2021"

[lib]
name = "shadowspore_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
