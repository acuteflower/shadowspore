services:
  postgres:
    image: postgres:16-alpine
    container_name: shadowspore_postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdev_password_change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama -d nakama"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.24.2
    container_name: shadowspore_nakama
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address nakama:localdev_password_change_me@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address nakama:localdev_password_change_me@postgres:5432/nakama
    ports:
      - "7349:7349" # gRPC API
      - "7350:7350" # HTTP API + WebSocket (Godot Client)
      - "7351:7351" # Admin-Konsole im Browser
    volumes:
      - ./local.yml:/nakama/data/local.yml:ro
      - ./modules:/nakama/data/modules:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
